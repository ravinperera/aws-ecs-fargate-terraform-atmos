name: Terraform Validation and Plan

on:
  pull_request:
    paths:
      - "infrastructure/**"
      - "**/*.md"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:
    inputs:
      stack:
        description: Atmos stack name
        required: true
        default: dev
      region:
        description: AWS region
        required: true
        default: eu-west-2
      component:
        description: Atmos component
        required: true
        default: aws/ecs-fargate-service

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.8.5
  ATMOS_VERSION: 1.95.0
  ATMOS_STACKS_NAME_PATTERN: "{environment}"
  ATMOS_COMPONENT: ${{ inputs.component || 'aws/ecs-fargate-service' }}
  ATMOS_STACK: ${{ inputs.stack || 'dev' }}

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test repository validation helper
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check local Markdown links
        run: python3 scripts/check_markdown_links.py .

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup Atmos
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/cloudposse/atmos/releases/download/v${ATMOS_VERSION}/atmos_${ATMOS_VERSION}_linux_amd64" \
            --output atmos
          sudo install -m 0755 atmos /usr/local/bin/atmos
          atmos version

      - name: Terraform format check
        working-directory: infrastructure/components/terraform/aws/ecs-fargate-service
        run: terraform fmt -check -recursive

      - name: Atmos Terraform validate
        working-directory: infrastructure
        run: atmos terraform validate "$ATMOS_COMPONENT" -s "$ATMOS_STACK"

  plan:
    name: Authenticated Terraform plan
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ inputs.region }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::111122223333:role/example-github-oidc-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup Atmos
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/cloudposse/atmos/releases/download/v${ATMOS_VERSION}/atmos_${ATMOS_VERSION}_linux_amd64" \
            --output atmos
          sudo install -m 0755 atmos /usr/local/bin/atmos
          atmos version

      - name: Atmos Terraform plan
        working-directory: infrastructure
        run: atmos terraform plan "$ATMOS_COMPONENT" -s "$ATMOS_STACK"
